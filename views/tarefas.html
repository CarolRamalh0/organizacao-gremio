    <script>
        // Sistema de atualização de progresso por card
        function updateProgress(cardNumber) {
            const checkboxes = document.querySelectorAll(`.tarefa-checkbox[data-card="${cardNumber}"]`);
            const progressBar = document.querySelector(`.progress-bar[data-card="${cardNumber}"]`);
            const progressText = document.querySelector(`.progress-percentage[data-card="${cardNumber}"]`);
            
            const total = checkboxes.length;
            const checked = Array.from(checkboxes).filter(cb => cb.checked).length;
            const percentage = Math.round((checked / total) * 100);
            
            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${percentage}%`;
        }
        
        // Adicionar listeners a todos os checkboxes
        document.querySelectorAll('.tarefa-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const cardNumber = this.getAttribute('data-card');
                updateProgress(cardNumber);
            });
        });
        
        // Inicializar todos os cards
        for (let i = 1; i <= 6; i++) {
            updateProgress(i);
        }
    </script>
