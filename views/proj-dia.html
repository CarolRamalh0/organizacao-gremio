<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L.I.G.A - Grêmio Estudantil - Projetos Dia-a-Dia</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/proj-dia.css">
    <script src="/scripts/proj-dia.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HEADER -->
    <header class="header-custom">
        <div class="logo-title">
            <h1>L.I.G.A</h1>
            <h2>Grêmio Estudantil</h2>
        </div>
        <nav class="nav-custom">
            <a href="/views/integrantes.html">Integrantes</a>
            <a href="/views/projetos.html">Projetos</a>
            <a href="/views/proj-dia.html" class="active">Projetos dia-a-dia</a>
            <a href="/views/minhas-tarefas.html">Minhas tarefas</a>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <div class="projetos-grid" id="projetos-grid"></div>
    </main>

    <!-- POPUP / MODAL -->
    <div class="popup-overlay" id="popup-overlay">
        <div class="popup-container">
            <div class="popup-header-tag" id="popup-nome-projeto">Nome do Projeto</div>
            
            <div class="popup-progress-section">
                <div class="popup-progress-wrapper">
                    <div class="popup-progress-bar">
                        <div class="popup-progress-fill" id="popup-progress-fill"></div>
                    </div>
                    <span class="popup-progress-percent" id="popup-progress-percent">0%</span>
                </div>
            </div>

            <div class="popup-content">
                <div class="popup-descricao" id="popup-descricao">
                    Descrição do projeto
                </div>

                <h3 class="popup-tarefas-titulo">✓ Tarefas</h3>
                <ul class="popup-tarefas-lista" id="popup-tarefas-lista"></ul>

                <div class="popup-add-tarefa">
                    <input type="text" class="popup-input-tarefa" id="input-nova-tarefa" placeholder="Digite uma nova tarefa...">
                    <button class="btn-add-tarefa" id="btn-add-tarefa">Adicionar</button>
                </div>
            </div>

            <div class="popup-footer">
                <button class="btn-excluir-projeto" id="btn-excluir-projeto">Excluir Projeto</button>
                <button class="btn-fechar-popup" id="btn-fechar-popup">Fechar Tarefas</button>
            </div>
        </div>
    </div>
</body>
</html>
